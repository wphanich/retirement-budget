<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>รายงานสรุปบัญชี งานเกษียณอายุราชการ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
  
  /* บังคับให้หน้ากระดาษเป็น A4 */
  @page { size: A4 portrait; margin: 15mm; }
  
  body { margin: 0; background: #e5e7eb; font-family: "Sarabun", sans-serif; color: #000; }

  .page { 
    width: 210mm; min-height: 297mm; background: #fff; 
    margin: 10px auto; padding: 15mm; box-sizing: border-box;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  /* ปรับขนาดตัวอักษรให้เล็กลงเพื่อไม่ให้ล้น */
  .head { text-align: center; margin-bottom: 5mm; }
  .head .org { font-size: 18pt; font-weight: 700; }
  .head .title { font-size: 16pt; font-weight: 700; margin-top: 2mm; }
  
  table { width: 100%; border-collapse: collapse; font-size: 12pt; }
  th, td { border: 1px solid #000; padding: 2mm; vertical-align: middle; }
  th { background: #f9f9f9; text-align: center; }
  
  .sec { font-size: 14pt; font-weight: 700; margin: 5mm 0 2mm; }
  .num { text-align: right; }
  .ctr { text-align: center; }

  /* แก้ไขการพิมพ์ */
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .page { margin: 0; box-shadow: none; }
  }

  .toolbar { 
    position: sticky; top: 0; background: #1e293b; padding: 10px; 
    display: flex; gap: 10px; justify-content: center; z-index: 100;
  }
  button { padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="history.back()">← กลับ</button>
  <button onclick="window.print()">🖨 พิมพ์รายงาน</button>
</div>

<div class="page">
  <div class="head">
    <div class="org" id="pOrg">สำนักงาน........................</div>
    <div class="title">รายงานสรุปรายรับ–รายจ่าย</div>
    <div id="pEvent">งานเกษียณอายุราชการ</div>
  </div>

  <div class="sec">๑. รายรับ</div>
  <table>
    <thead><tr><th>ที่</th><th>วันที่</th><th>รายการ</th><th>จำนวนเงิน</th></tr></thead>
    <tbody id="tIncome"></tbody>
  </table>

  <div class="sec">๒. รายจ่าย</div>
  <table>
    <thead><tr><th>ที่</th><th>วันที่</th><th>รายการ</th><th>จำนวนเงิน</th></tr></thead>
    <tbody id="tExpense"></tbody>
  </table>
  <div id="summaryBox"></div>
  <!-- ส่วนลงนาม -->
  <div style="margin-top: 20mm; display: flex; justify-content: space-between; text-align: center;">
    <div>(......................)<br>ผู้จัดทำ</div>
    <div>(......................)<br>ผู้อนุมัติ</div>
  </div>
</div>

<script type="module" src="report.js"></script>
</body>
</html>
